name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact: PicLite-Windows-x64
          - name: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            node_arch: x64
            bundles: nsis,msi
            artifact: PicLite-Windows-arm64
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: PicLite-macOS-arm64
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            artifact: PicLite-macOS-x64
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            artifact: PicLite-Linux-x64
          - name: Linux arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage,deb
            artifact: PicLite-Linux-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          architecture: ${{ matrix.node_arch || '' }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Typecheck and native regression tests
        run: |
          npx tsc --noEmit
          npm run desktop:renderer
          node --experimental-strip-types --test tests/operation-feedback.test.mjs tests/watch-settings.test.mjs tests/floating-window-state.test.mjs tests/shortcuts.test.mjs tests/clipboard-import.test.mjs tests/automatic-result-copy.test.mjs tests/floating-appearance.test.mjs
      - name: Run native Rust regression tests
        if: runner.os != 'Windows'
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.target }}
      - name: Compile Windows Rust regression tests
        if: runner.os == 'Windows'
        # Windows Server 2025 currently fails to load Cargo's generated Rust test executable
        # with STATUS_ENTRYPOINT_NOT_FOUND. The installed app is exercised below by WebView2 smoke tests.
        run: cargo check --tests --release --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.target }}
      - name: Configure the updater trust key
        env:
          PICLITE_UPDATER_PUBLIC_KEY: ${{ vars.PICLITE_UPDATER_PUBLIC_KEY }}
        run: >-
          node -e "const pubkey = process.env.PICLITE_UPDATER_PUBLIC_KEY.trim();
          if (!pubkey) throw Error('Missing PICLITE_UPDATER_PUBLIC_KEY');
          require('fs').writeFileSync('updater-release.conf.json', JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey}}}));"
      - name: Build signed Tauri update bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config updater-release.conf.json
      - name: Stage installers and updater assets
        shell: bash
        env:
          BUNDLE: src-tauri/target/${{ matrix.target }}/release/bundle
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir desktop-artifacts
          case "$RUNNER_OS" in
            Windows)
              cp "$BUNDLE"/msi/*.msi "$BUNDLE"/msi/*.msi.sig "$BUNDLE"/nsis/*.exe.sig desktop-artifacts/
              ;;
            macOS)
              arch=x64
              if [[ "$TARGET" == aarch64-* ]]; then arch=aarch64; fi
              version=$(node -p 'require("./package.json").version')
              archive="desktop-artifacts/PicLite_${version}_${arch}.app.tar.gz"
              cp "$BUNDLE"/dmg/*.dmg desktop-artifacts/
              cp "$BUNDLE/macos/PicLite.app.tar.gz" "$archive"
              cp "$BUNDLE/macos/PicLite.app.tar.gz.sig" "$archive.sig"
              ;;
            Linux)
              cp "$BUNDLE"/appimage/*.AppImage "$BUNDLE"/appimage/*.AppImage.sig "$BUNDLE"/deb/*.deb desktop-artifacts/
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-packages
          path: desktop-artifacts/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ${{ matrix.artifact }}-nsis
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Cover renderer pixel regression
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          npm run desktop:renderer:dev -- --host 127.0.0.1 --port 1551 > /tmp/cover-vite.log 2>&1 &
          npx --yes @puppeteer/browsers install chrome@stable --path /tmp/cover-chrome > /tmp/cover-chrome-path
          chrome=$(find /tmp/cover-chrome -type f -name chrome | head -1)
          "$chrome" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9443 --user-data-dir=/tmp/cover-profile about:blank > /tmp/cover-chrome.log 2>&1 &
          for n in {1..60}; do curl -fsS http://127.0.0.1:1551/ >/dev/null && curl -fsS http://127.0.0.1:9443/json/version >/dev/null && break; sleep 1; done
          node tests/cover-entrypoints-ui.mjs
          node tests/clipboard-roundtrip-ui.mjs
          node tests/floating-completion-ui.mjs
          node tests/floating-session-controls-ui.mjs
          node tests/clipboard-source-settings-ui.mjs
          node tests/desktop-update-ui.mjs
      - name: MCP protocol integration tests
        shell: bash
        env:
          PICLITE_BINARY: ${{ github.workspace }}/src-tauri/target/${{ matrix.target }}/release/piclite${{ runner.os == 'Windows' && '.exe' || '' }}
        run: node tests/mcp-smoke.mjs

      - name: Ensure official WebView2 Runtime is installed
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $runtime
          $install = Start-Process $runtime -ArgumentList '/silent /install' -Wait -PassThru
          Write-Host "WebView2 installer result: $($install.ExitCode)"
          Get-ChildItem 'C:/Program Files (x86)/Microsoft/EdgeWebView/Application','C:/Program Files/Microsoft/EdgeWebView/Application' -ErrorAction SilentlyContinue
      - name: Windows native WebView2 floating window regression
        if: runner.os == 'Windows'
        timeout-minutes: 15
        env:
          PICLITE_BINARY: ${{ github.workspace }}/src-tauri/target/${{ matrix.target }}/release/piclite.exe
        run: node tests/floating-windows-native-ui.mjs
      - name: Upload native Windows UI verification
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-${{ matrix.target }}
          path: native-ui-artifacts

      - name: Package Windows portable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "portable/${{ matrix.artifact }}-portable"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/piclite.exe" "$dir/PicLite.exe"
          Set-Content "$dir/portable.txt" "PicLite portable mode"
          Copy-Item "docs/PORTABLE.txt" "$dir/README.txt"
          Compress-Archive -Path "$dir/*" -DestinationPath "${{ matrix.artifact }}-portable.zip"
      - name: Upload Windows portable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-portable
          path: ${{ matrix.artifact }}-portable.zip

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
          pattern: PicLite-*
      - name: Verify updater signatures and generate the update feed
        env:
          PICLITE_UPDATER_PUBLIC_KEY: ${{ vars.PICLITE_UPDATER_PUBLIC_KEY }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y minisign
          python3 scripts/desktop-update-manifest.py artifacts "${GITHUB_REF_NAME#v}"
      - name: Publish installers and the update feed together
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          test "$(node -p 'require("./package.json").version')" = "$version"
          mapfile -d '' files < <(find artifacts -type f -print0)
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            if [[ "$draft" == false ]]; then
              gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' > existing-assets.txt
              for file in "${files[@]}"; do grep -Fx -- "${file##*/}" existing-assets.txt; done
              exit 0
            fi
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --draft \
              --title "PicLite 图轻 $GITHUB_REF_NAME" --notes-file "docs/RELEASE-$version.md"
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
