name: Restore Docker release 2.1.3
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Restore published 2.1.3 tags and remove mistaken 2.1.4 manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, os, base64, time
          token = os.environ['GH_TOKEN']
          owner = 'amiaoapp'
          package = 'piclite'
          registry = 'https://ghcr.io'
          scope = 'repository:amiaoapp/piclite:pull,push'
          basic = base64.b64encode((owner + ':' + token).encode()).decode()
          request = urllib.request.Request(registry + '/token?' + urllib.parse.urlencode({'service':'ghcr.io','scope':scope}),headers={'Authorization':'Basic ' + basic})
          with urllib.request.urlopen(request) as response: bearer = json.load(response)['token']
          accept = 'application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json'
          def manifest(tag, data=None, media=None):
              headers = {'Authorization':'Bearer ' + bearer,'Accept':accept}
              if data is not None: headers['Content-Type'] = media
              request = urllib.request.Request(registry+'/v2/'+owner+'/'+package+'/manifests/'+tag, data=data,headers=headers,method='PUT' if data is not None else 'GET')
              with urllib.request.urlopen(request) as response: return response.read(),response.headers.get('Content-Type'),response.headers.get('Docker-Content-Digest')
          source,media,digest = manifest('2.1.3')
          assert json.loads(source).get('manifests'), 'Expected a multi-architecture 2.1.3 image'
          _,_,mistake = manifest('2.1.4')
          assert mistake != digest
          for tag in ['latest','2.1']:
              manifest(tag,source,media)
              assert manifest(tag)[2] == digest
          print('Restored latest and 2.1 to existing 2.1.3 manifest:',digest)
          def api(path, method='GET'):
              request=urllib.request.Request('https://api.github.com/'+path,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},method=method)
              with urllib.request.urlopen(request) as response: return json.loads(response.read() or 'null')
          prefix = 'users/'+owner+'/packages/container/'+package+'/versions'
          for attempt in range(12):
              versions=api(prefix+'?per_page=100')
              candidates=[v for v in versions if v['name']==mistake and '2.1.4' in v['metadata']['container']['tags']]
              assert len(candidates)==1,'Expected exactly one mistaken version'
              version=candidates[0]
              if set(version['metadata']['container']['tags'])=={'2.1.4'}:break
              time.sleep(2)
          else:raise RuntimeError('Tags have not propagated; refusing to remove a manifest with other tags')
          api(prefix+'/'+str(version['id']),'DELETE')
          assert not any('2.1.4' in v['metadata']['container']['tags'] for v in api(prefix+'?per_page=100'))
          print('Removed the mistaken 2.1.4 manifest. Desktop release stays at 2.1.3.')
          PY
