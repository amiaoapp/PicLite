name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional version tag, for example 1.1.10
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: runner
            image: piclite
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: runner
            image: piclite
          - arch: amd64
            runner: ubuntu-24.04
            target: mcp
            image: piclite-mcp
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: mcp
            image: piclite-mcp
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=PicLite ${{ matrix.target == 'mcp' && 'authenticated remote MCP service' || 'self-hosted web application' }}

      - name: Build native image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max
          provenance: mode=max
          sbom: true

      - name: Set up Node for production browser smoke
        if: matrix.target == 'runner' && matrix.arch == 'amd64'
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Node for Docker MCP smoke
        if: matrix.target == 'mcp'
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies for browser and MCP smoke tests
        if: matrix.target == 'mcp' || (matrix.target == 'runner' && matrix.arch == 'amd64')
        run: npm ci --omit=dev

      - name: Smoke test native image and amd64 browser UI
        if: matrix.target == 'runner'
        timeout-minutes: 6
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SMOKE_ARCH: ${{ matrix.arch }}
          ORIGIN: http://127.0.0.1:3456
          ARTIFACTS: ${{ runner.temp }}/docker-ui-smoke
        run: |
          set -euo pipefail
          container="piclite-web-smoke-$SMOKE_ARCH"
          trap 'docker logs "$container" || true; docker rm -f "$container" || true' EXIT
          image="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          docker pull "$image@$DIGEST"
          docker run -d --name "$container" -p 127.0.0.1:3456:3456 "$image@$DIGEST"
          healthy=false
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$container")
            if [ "$status" = healthy ]; then
              healthy=true
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container")" != true ]; then
              exit 1
            fi
            sleep 3
          done
          [ "$healthy" = true ]
          docker exec "$container" node -e '
            (async () => {
              const origin = "http://127.0.0.1:3456";
              const response = await fetch(origin);
              if (!response.ok) throw new Error("Homepage HTTP " + response.status);
              const html = await response.text();
              if (!html.includes("PicLite")) throw new Error("Missing PicLite application");
              const assets = [...html.matchAll(/(?:src|href)="([^"]+\.(?:js|css)(?:\?[^\"]*)?)"/g)].map(match => match[1]);
              if (!assets.length) throw new Error("No production assets");
              for (const asset of assets) {
                const result = await fetch(new URL(asset, origin));
                if (!result.ok) throw new Error("Asset HTTP " + result.status + ": " + asset);
              }
              console.log("PASS native container health, homepage and " + assets.length + " assets");
            })().catch(error => { console.error(error); process.exit(1); });'
          if [ "$SMOKE_ARCH" = amd64 ]; then
            # The hosted x64 runner supplies Chrome.
            CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable)
            export CHROME_BIN
            "$CHROME_BIN" --version
            node tests/docker-ui-smoke.mjs
          fi

      - name: Smoke test authenticated Docker MCP service
        if: matrix.target == 'mcp'
        timeout-minutes: 6
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PICLITE_MCP_URL: http://127.0.0.1:3210/mcp
        run: |
          set -euo pipefail
          container="piclite-mcp-smoke-${{ matrix.arch }}"
          workspace="$RUNNER_TEMP/piclite-mcp-workspace"
          export PICLITE_MCP_TOKEN="$(openssl rand -hex 32)"
          mkdir -p "$workspace/input" "$workspace/output"
          image="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          trap 'docker logs "$container" || true; docker rm -f "$container" || true' EXIT
          docker pull "$image@$DIGEST"
          docker run -d --name "$container" \
            --init --user "$(id -u):$(id -g)" --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:mode=1777,size=64m --memory 1g \
            -e PICLITE_MCP_TOKEN \
            -v "$workspace/input:/workspace/input:ro" \
            -v "$workspace/output:/workspace/output" \
            -p 127.0.0.1:3210:3210 "$image@$DIGEST"
          healthy=false
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$container")
            if [ "$status" = healthy ]; then healthy=true; break; fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container")" != true ]; then exit 1; fi
            sleep 3
          done
          [ "$healthy" = true ]
          PICLITE_MCP_TEST_WORKSPACE="$workspace" node tests/mcp-docker-smoke.mjs

      - name: Upload production browser smoke evidence
        if: always() && matrix.target == 'runner' && matrix.arch == 'amd64'
        uses: actions/upload-artifact@v7
        with:
          name: docker-ui-smoke-${{ matrix.arch }}
          path: ${{ runner.temp }}/docker-ui-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Export tested digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload tested digest
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 10
    strategy:
      matrix:
        image: [piclite, piclite-mcp]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests/amd64
          name: image-digest-${{ matrix.image }}-amd64

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests/arm64
          name: image-digest-${{ matrix.image }}-arm64

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ inputs.version || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version || github.ref_name }}

      - name: Publish multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          args=()
          while IFS= read -r tag; do
            [ -z "$tag" ] || args+=(--tag "$tag")
          done <<< "$TAGS"
          sources=()
          for arch in amd64 arm64; do
            mapfile -t digests < <(find "$arch" -maxdepth 1 -type f -printf '%f\n')
            [ "${#digests[@]}" -eq 1 ]
            digest="${digests[0]}"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            sources+=("$image@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$image:latest"
