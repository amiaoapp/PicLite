name: Publish validated desktop artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build desktop apps run ID
        required: true
        type: string
      version:
        description: Version without v prefix
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-validated-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_ID: ${{ inputs.run_id }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify successful source run and exact release version
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > /tmp/source-run.json
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .conclusion == "success" and .status == "completed" and
            .path == ".github/workflows/release-desktop.yml" and
            .head_repository.full_name == $repo
          ' /tmp/source-run.json
          sha=$(jq -r .head_sha /tmp/source-run.json)
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          git fetch origin "$sha" --depth=1
          git checkout --detach "$sha"
          test "$(node -p 'require("./package.json").version')" = "$VERSION"
          test -f "docs/RELEASE-$VERSION.md"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}
          path: artifacts
          merge-multiple: true
      - name: Verify complete packages, portable architectures and checksums
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os, struct, zipfile
          from pathlib import Path
          version = os.environ['VERSION']
          root = Path('artifacts')
          expected = {
              f'PicLite_{version}_{arch}.{ext}'
              for arch, ext in [('aarch64','AppImage'), ('amd64','AppImage'),
                                ('arm64','deb'), ('amd64','deb'),
                                ('aarch64','dmg'), ('x64','dmg')]
          }
          for arch in ['arm64', 'x64']:
              expected.update([f'PicLite_{version}_{arch}-setup.exe',
                               f'PicLite_{version}_{arch}_en-US.msi',
                               f'PicLite-Windows-{arch}-portable.zip'])
          files = [p for p in root.rglob('*') if p.is_file()]
          assert len(files) == len(expected), [p.name for p in files]
          assert {p.name for p in files} == expected, [p.name for p in files]
          for path in files:
              assert path.stat().st_size > 1_000_000, path.name
              if path.name.endswith('-portable.zip'):
                  with zipfile.ZipFile(path) as archive:
                      assert archive.testzip() is None, path.name
                      assert {'PicLite.exe','portable.txt','README.txt'} <= set(archive.namelist())
                      exe = archive.read('PicLite.exe')
                      assert exe[:2] == b'MZ', path.name
                      offset = struct.unpack_from('<I', exe, 0x3c)[0]
                      assert exe[offset:offset+4] == b'PE\0\0', path.name
                      machine = struct.unpack_from('<H', exe, offset+4)[0]
                      assert machine == (0xAA64 if 'arm64' in path.name else 0x8664), path.name
          (root/'SHA256SUMS').write_text(''.join(
              hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n'
              for p in sorted(files, key=lambda p: p.name)
          ))
          print('Verified all 12 installers/portable archives and Windows CPU architectures.')
          PY
      - name: Publish the verified source and original artifacts
        env:
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find artifacts -type f -print0)
          gh release create "v$VERSION" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" \
            --title "PicLite 图轻 v$VERSION" --notes-file "docs/RELEASE-$VERSION.md" --draft
          test "$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" = 13
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
