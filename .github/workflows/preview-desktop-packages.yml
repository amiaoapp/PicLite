name: Build preview desktop packages

on:
  workflow_dispatch:
  push:
    branches:
      - codex/builtin-tools-preview

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows ARM64 preview
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            node_arch: x64
            bundles: nsis,msi
            artifact: PicLite-Windows-arm64-preview
          - name: macOS Apple Silicon preview
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: PicLite-macOS-arm64-preview

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          architecture: ${{ matrix.node_arch || '' }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - name: Validate renderer and native code
        run: |
          npx tsc --noEmit
          npm run desktop:renderer
          node --experimental-strip-types --test tests/operation-feedback.test.mjs tests/watch-settings.test.mjs tests/floating-window-state.test.mjs
          cargo test --release --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.target }}
      - name: Build installers
        uses: tauri-apps/tauri-action@v1
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.preview.conf.json
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: ${{ matrix.artifact }}-[bundle]
      - name: Package Windows portable build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "portable/PicLite-Windows-arm64-preview-portable"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/piclite.exe" "$dir/PicLite.exe"
          Set-Content "$dir/portable.txt" "PicLite portable mode"
          Copy-Item "docs/PORTABLE.txt" "$dir/README.txt"
          Compress-Archive -Path "$dir/*" -DestinationPath "PicLite-Windows-arm64-preview-portable.zip"
      - name: Upload Windows portable build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: PicLite-Windows-arm64-preview-portable
          path: PicLite-Windows-arm64-preview-portable.zip
