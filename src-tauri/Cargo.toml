[package]
name = "piclite"
version = "1.8.0"
description = "PicLite local-first image compressor"
authors = ["PicLite contributors"]
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "piclite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.6"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
color_quant = "1.1"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
notify = "8.2"
percent-encoding = "2.3"
png = "0.18.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
ttf-parser = "0.25"
url = "2.5"
webp = "0.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_DataExchange"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
